<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark" />

		<title>Nirvatia — Frontend и 1С</title>
		<meta
			name="description"
			content="Nirvatia — фронтенд и 1С. Портфолио в формате интервью: один экран, ноль скроллов. Работы, процесс, связь."
		/>
		<link rel="canonical" href="https://nirvatia.vercel.app/" />

		<!-- Open Graph: превью в мессенджерах и соцсетях -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Nirvatia" />
		<meta property="og:title" content="Nirvatia — интервью вместо портфолио" />
		<meta
			property="og:description"
			content="Один экран, ноль скроллов. Frontend и 1С. Вопросы и ответы вместо резюме."
		/>
		<meta property="og:url" content="https://nirvatia.vercel.app/" />
		<meta property="og:image" content="https://nirvatia.vercel.app/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Nirvatia — интервью вместо портфолио" />
		<meta property="og:locale" content="ru_RU" />
		<meta name="twitter:card" content="summary_large_image" />

		<!-- Иконки -->
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />

		<meta name="theme-color" content="#131312" />

		<!-- Структурные данные: кто это и где живёт -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Person",
				"name": "Nirvatia",
				"jobTitle": "Frontend-разработчик, 1С",
				"url": "https://nirvatia.vercel.app/"
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" style="background-color: #131312">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
