<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Интервью вместо портфолио. Без единого скролла.">
<meta name="theme-color" content="#f6f5f1">
<meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
<title>Интервью — без скролла</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f5f1; --ink:#161513; --mut:#6e6c66;
    --line:#d8d5cc; --mark:#c0442b;
    --serif:"Newsreader",Georgia,serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{--paper:#131312;--ink:#e8e6df;--mut:#8b897f;--line:#2b2b28;--mark:#d05a3e}
  }
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 var(--serif);
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  ::selection{background:var(--ink);color:var(--paper)}
  :focus-visible{outline:1px solid var(--ink);outline-offset:3px}
  a{color:inherit;text-decoration:underline;text-underline-offset:3px;
    text-decoration-thickness:1px;text-decoration-color:var(--mark)}
  a:hover{color:var(--mark)}

  /* ================= ЛОАДЕР: идёт запись ================= */
  #loader{position:fixed;inset:0;z-index:50;background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    transition:opacity .55s ease,visibility .55s}
  #loader.done{opacity:0;visibility:hidden}
  .loaderbox{display:flex;flex-direction:column;gap:24px;width:min(340px,82vw)}
  .rec{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;
    letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--mark);flex:none;
    animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.25}}
  .checks{display:flex;flex-direction:column;gap:7px;font-family:var(--mono);
    font-size:12px;line-height:1.5;color:var(--mut);min-height:104px}
  .checks .ln{opacity:0;animation:lnIn .45s ease forwards}
  @keyframes lnIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .rule{height:1px;background:var(--line);position:relative;overflow:hidden}
  .rule span{position:absolute;inset:0;background:var(--ink);transform:scaleX(0);
    transform-origin:left;animation:rule 2.3s cubic-bezier(.3,0,.2,1) forwards}
  @keyframes rule{to{transform:scaleX(1)}}

  /* ================= СТРАНИЦА ================= */
  .wrap{height:100vh;height:100dvh;max-width:1040px;margin:0 auto;
    padding:calc(14px + env(safe-area-inset-top)) clamp(16px,4vw,24px)
      calc(14px + env(safe-area-inset-bottom));
    display:grid;grid-template-rows:auto 1fr auto auto;gap:clamp(10px,1.6vh,16px);
    opacity:0}
  .wrap.ready{opacity:1;transition:opacity .6s ease .15s}

  header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
    font-family:var(--mono);font-size:clamp(10px,1.3vw,11px);letter-spacing:.14em;
    text-transform:uppercase;color:var(--mut)}
  header .brand{color:var(--ink);font-weight:500}
  header .dot{animation-duration:2.6s;margin-right:8px}

  .stage{position:relative;overflow-y:auto;scrollbar-width:none;display:flex;touch-action:pan-y}
  .stage::-webkit-scrollbar{display:none}
  .card{width:100%;margin:auto 0;min-height:0;animation:cardIn .65s cubic-bezier(.16,1,.3,1) both;
    display:grid;grid-template-columns:minmax(0,1fr) clamp(150px,19vw,205px);
    column-gap:clamp(24px,4vw,40px);align-items:start}
  @keyframes cardIn{from{opacity:0;transform:translateY(var(--dy,16px))}}
  .cmain{min-width:0}

  .no{font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.2em;
    margin-bottom:clamp(8px,1.4vh,14px)}
  .q{font-family:var(--mono);font-size:clamp(12px,1.5vw,13px);color:var(--mut);
    margin:0 0 clamp(10px,1.8vh,18px);letter-spacing:.04em;margin-left:-2ch;
    hanging-punctuation:first}
  .a{font-size:clamp(21px,4.6vw,38px);line-height:1.3;letter-spacing:-.01em;
    margin:0 0 clamp(8px,1.4vh,14px);hanging-punctuation:first last}
  .a em{font-style:italic;color:var(--mark)}
  .a.small{font-size:clamp(14px,1.8vw,18px);color:var(--mut);margin-top:clamp(12px,2vh,20px)}
  .a.dropcap::first-letter{float:left;font-size:3.1em;line-height:.72;font-weight:500;
    padding-right:.12em;margin-top:.06em}

  .side{margin-top:clamp(34px,5vh,48px);font-family:var(--mono);font-size:11px;
    line-height:1.8;color:var(--mut);text-align:right;letter-spacing:.04em}
  .side b{color:var(--ink);font-weight:400}

  .works{margin-top:clamp(12px,2vh,20px)}
  .w{display:grid;grid-template-columns:minmax(0,1fr) clamp(130px,16vw,175px);
    column-gap:clamp(16px,2.6vw,28px);align-items:start;
    padding:clamp(9px,1.4vh,13px) 0;border-bottom:1px dotted var(--line)}
  .w:last-child{border-bottom:0}
  .wmain{min-width:0;display:block}
  .wt{font-size:clamp(16px,2.2vw,22px);transition:color .2s}
  .w:hover .wt{color:var(--mark)}
  .wa{opacity:0;transform:translateX(-4px);transition:.25s;display:inline-block;margin-left:.4em}
  .w:hover .wa{opacity:1;transform:none}
  .wd{display:block;font-size:clamp(13px,1.5vw,14px);color:var(--mut);line-height:1.5;margin-top:2px}
  .wy{display:none;font-family:var(--mono);font-size:12px;color:var(--mut);margin-left:8px}
  .note{font-family:var(--mono);font-size:11px;line-height:1.7;color:var(--mut);
    text-align:right;letter-spacing:.04em;padding-top:4px}
  .note b{color:var(--ink);font-weight:400}

  form{display:grid;gap:clamp(12px,1.8vh,18px);max-width:460px;margin-top:clamp(14px,2.4vh,26px)}
  label{display:grid;gap:5px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--mut)}
  input,textarea{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;
    color:var(--ink);font:16px/1.5 var(--serif);padding:5px 0;outline:none;width:100%}
  input:focus,textarea:focus{border-color:var(--mark);caret-color:var(--mark)}
  textarea{resize:vertical;min-height:clamp(56px,10vh,80px)}
  button{justify-self:start;font-family:var(--mono);font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;background:transparent;color:var(--ink);
    border:1px solid var(--ink);padding:.75em 1.7em;cursor:pointer}
  button:hover{background:var(--ink);color:var(--paper)}
  .fwrap.appeared{animation:cardIn .65s cubic-bezier(.16,1,.3,1) both}

  .chapters{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;
    border-top:1px solid var(--line);padding-top:clamp(9px,1.4vh,13px)}
  .chapters button{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    background:transparent;border:0;color:var(--mut);cursor:pointer;padding:4px 9px}
  .chapters button:hover{color:var(--ink)}
  .chapters button[aria-current]{background:var(--ink);color:var(--paper)}
  .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.1em}
  .count b{color:var(--mark);font-weight:400}

  .fineprint{display:flex;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;
    font-family:var(--mono);font-size:clamp(9.5px,1.2vw,10.5px);letter-spacing:.06em;color:var(--mut)}
  .fineprint a{color:inherit}

  /* ================= АДАПТИВ ================= */
  @media (max-width:760px){
    .card{grid-template-columns:1fr}
    .side{display:none}
    .w{grid-template-columns:1fr}
    .note{display:none}
    .wy{display:inline}
    .count{margin-left:auto}
  }
  @media (max-width:400px){
    .chapters{gap:4px 6px}
    .chapters button{padding:4px 6px;font-size:10px}
  }
  @media (max-height:600px){
    .no{margin-bottom:6px}
    .q{margin-bottom:8px}
    .a{margin-bottom:6px}
    .a.dropcap::first-letter{font-size:2.6em}
    .works{margin-top:8px}
    .w{padding:7px 0}
    form{gap:10px;margin-top:12px}
    .side{margin-top:30px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .checks .ln{opacity:1}
    .rule span{transform:scaleX(1)}
    .wrap{opacity:1}
  }
  @media print{
    html,body{height:auto;overflow:visible}
    #loader{display:none}
    .wrap{display:block;height:auto;max-width:760px;opacity:1}
    .stage{overflow:visible}
    .card{margin:0 0 44px}
    .chapters,.fineprint{display:none}
  }
</style>
</head>
<body>

<!-- ================= ЛОАДЕР ================= -->
<div id="loader">
  <div class="loaderbox">
    <div class="rec"><span class="dot"></span>идёт запись</div>
    <div class="checks" id="checks"></div>
    <div class="rule"><span></span></div>
  </div>
</div>

<!-- ================= СТРАНИЦА ================= -->
<div class="wrap" id="wrap" aria-busy="true">

  <header>
    <span class="brand">NIRVATIA_OS</span>
    <span><span class="dot"></span>открыт к проектам</span>
  </header>

  <div class="stage" id="stage" aria-live="polite"></div>

  <nav class="chapters" id="chapters" aria-label="вопросы"></nav>

  <div class="fineprint">
    <span>здесь некуда скроллить — и это осознанно</span>
    <span id="hint"></span>
  </div>

</div>

<noscript>
  <style>#loader{display:none}</style>
  <p style="padding:20px;font-family:monospace">Включите JavaScript — интервью листается клавиатурой.</p>
</noscript>

<script>
/* =====================================================================
   ДАННЫЕ. Сейчас — мок с задержкой. Для Sanity замените тело функции:

   import { createClient } from '@sanity/client';
   const sanity = createClient({ projectId:'xxxx', dataset:'production',
     apiVersion:'2025-01-01', useCdn:true });
   function loadData(){ return sanity.fetch(`*[_type=="interview"][0]{
     status, cards[]{ no, label, q, a, side, type, works[]{t,d,url,year,note} }
   }`); }

   В тексте ответов *звёздочками* выделяется красное.
===================================================================== */
const INTERVIEW_DATA = {
  cards:[
    { no:'01', label:'Кто ты', q:'Кто ты?',
      a:'Я проектирую и собираю интерфейсы. *Десять лет* — от писем и лендингов до дизайн-систем на сорок экранов. Люблю, когда сложное становится простым. И когда это можно проверить цифрами.',
      side:'10 лет в деле ·\n2–3 проекта параллельно' },
    { no:'02', label:'Работы', q:'Что ты делал?', type:'works',
      a:'Четыре работы, за которые не стыдно.',
      side:'четыре из сорока ·\nпоказываю только то,\nза что не стыдно',
      works:[
        { t:'Касса для рынка', d:'приложение для продавцов без технического образования',
          url:'#', year:'2025', note:['2025 · react, pwa','время заказа −40%'] },
        { t:'Полка', d:'читалка длинных текстов: страница грузится быстрее, чем моргаете',
          url:'#', year:'2024', note:['2024 · 14 кб js','lighthouse 100/100'] },
        { t:'Тихий бэкофис', d:'внутренняя система для логистики — минус три таблицы, плюс здравый смысл',
          url:'#', year:'2024', note:['2024 · vue, go','6 недель до продакшена'] },
        { t:'Этот сайт', d:'один экран, ноль скроллов. выглядит просто — делался нет',
          url:'', year:'2025', note:['2025 · без библиотек','0 скроллов'] } ] },
    { no:'03', label:'Процесс', q:'Как ты работаешь?',
      a:'Сначала вопросы, потом макеты. Говорю правду про сроки — даже если она неудобная. Беру два-три проекта одновременно: не потому что ленивый, а потому что в каждый *влезаю по-настоящему*.',
      side:'сначала вопросы ·\nсроки без фантазий' },
    { no:'04', label:'Строгость', q:'Почему страница такая строгая?',
      a:'Ты пришёл смотреть работы, а не мои анимации. Здесь нет ничего, что отвлекает от сути. Если кажется, что слишком просто, — так и задумано: *усилия ушли в тексты*.',
      side:'0 скроллов ·\n2 гарнитуры ·\n1 цвет' },
    { no:'05', label:'Цена', q:'Сколько это стоит?',
      a:'От восьмидесяти тысяч за лендинг, от трёхсот — за приложение. Точную цифру называю после разговора — и потом её *не меняю*.',
      side:'цифры — ориентир ·\nточная — после разговора' },
    { no:'06', label:'Связь', q:'Как тебя найти?', type:'form',
      a:'Никак, кроме этой формы. Пара строк — и я отвечу в течение дня.',
      side:'отвечаю в течение дня ·\nобычно быстрее' }
  ]
};

function loadData(){
  return new Promise(res => setTimeout(()=>res(INTERVIEW_DATA), 1500 + Math.random()*700));
}

/* ================= общее ================= */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse  = matchMedia('(pointer: coarse)').matches;
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const emph = s => esc(s).replace(/\*(.+?)\*/g,'<em>$1</em>');
const sleep = ms => new Promise(r=>setTimeout(r,ms));

let cards = [], cur = 0;
const stage = document.getElementById('stage');
const chapters = document.getElementById('chapters');

/* ================= рендер карточек из данных ================= */
function workRow(w){
  const title = `<span class="wt">${esc(w.t)}${w.url?'<span class="wa">→</span>':''}</span>`;
  return `<div class="w"><span class="wmain">` +
    (w.url ? `<a href="${esc(w.url)}" style="text-decoration:none">${title}</a>` : title) +
    `<span class="wy">${esc(w.year||'')}</span>` +
    `<span class="wd">${esc(w.d)}</span></span>` +
    `<span class="note">${(w.note||[]).map((n,i)=>i===0?`<b>${esc(n)}</b>`:esc(n)).join('<br>')}</span></div>`;
}
function cardHTML(c){
  let main = `<div class="no">${esc(c.no)}</div><p class="q">— ${esc(c.q)}</p>`;
  if(c.type==='works'){
    main += `<p class="a dropcap">${emph(c.a)}</p><div class="works">${c.works.map(workRow).join('')}</div>`;
  }else if(c.type==='form'){
    main += `<div class="fwrap"><p class="a dropcap">${emph(c.a)}</p>
      <form id="form" novalidate>
        <label>имя <input type="text" id="f-name" name="name" required></label>
        <label>почта <input type="email" name="email" required></label>
        <label>о чём речь <textarea name="message" required></textarea></label>
        <button type="submit">Отправить</button>
      </form></div>`;
  }else{
    main += `<p class="a dropcap">${emph(c.a)}</p>`;
  }
  const side = c.side ? `<div class="side">${esc(c.side).replace(/\n/g,'<br>')}</div>` : '';
  return `<section class="card"><div class="cmain">${main}</div>${side}</section>`;
}

/* ================= навигация ================= */
function buildChapters(labels){
  labels.forEach((l,i)=>{
    const b = document.createElement('button');
    b.textContent = l;
    b.addEventListener('click', ()=>go(i));
    chapters.appendChild(b);
  });
  const count = document.createElement('span');
  count.className = 'count'; count.id = 'count';
  chapters.appendChild(count);
}
function paint(){
  [...chapters.querySelectorAll('button')].forEach((b,i)=>
    i===cur ? b.setAttribute('aria-current','true') : b.removeAttribute('aria-current'));
  const c = document.getElementById('count');
  if(c) c.innerHTML = '<b>'+String(cur+1).padStart(2,'0')+'</b> / '+String(cards.length).padStart(2,'0');
}
function render(dir){
  stage.style.setProperty('--dy', (dir>0 ? 16 : -16)+'px');
  stage.innerHTML = cards[cur];
  stage.scrollTop = 0;
  bindForm();
  paint();
}
function go(i){ if(i===cur || i<0 || i>=cards.length) return; const dir = i>cur?1:-1; cur=i; render(dir); }
function next(){ cur=(cur+1)%cards.length; render(1); }
function prev(){ cur=(cur-1+cards.length)%cards.length; render(-1); }

document.addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea')) return;
  if(e.key==='ArrowRight'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); prev(); }
  else if(/^[1-9]$/.test(e.key) && +e.key-1 < cards.length){ e.preventDefault(); go(+e.key-1); }
  else if(e.key==='/'){
    e.preventDefault();
    const fi = cards.findIndex(c=>c.type==='form');
    if(fi>-1){ go(fi); setTimeout(()=>document.getElementById('f-name')?.focus(), 60); }
  }
});

let x0=null;
stage.addEventListener('touchstart', e=>{ x0=e.touches[0].clientX; }, {passive:true});
stage.addEventListener('touchend', e=>{
  if(x0==null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if(Math.abs(dx)>48){ dx<0 ? next() : prev(); }
  x0=null;
}, {passive:true});

/* ================= форма (контакты убраны — только она) ================= */
function bindForm(){
  const f = document.getElementById('form'); if(!f) return;
  f.addEventListener('submit', e=>{
    e.preventDefault();
    const d = new FormData(f);
    const name = esc(d.get('name')), mail = esc(d.get('email'));
    /* Реальная отправка:
       fetch('https://formsubmit.co/ajax/you@example.com', {method:'POST',
         headers:{'Content-Type':'application/json'},
         body: JSON.stringify(Object.fromEntries(d))}); */
    const body = encodeURIComponent(`Имя: ${d.get('name')}\n\n${d.get('message')}`);
    location.href = `mailto:you@example.com?subject=${encodeURIComponent('с сайта')}&body=${body}`;
    const wrap = document.querySelector('.fwrap');
    wrap.classList.add('appeared');
    wrap.innerHTML =
      `<p class="q" style="margin-top:26px">— И что дальше?</p>
       <p class="a dropcap">Спасибо, ${name}. Черновик письма открыт — отправь его,
       и я отвечу на ${mail}. Обычно в течение дня.</p>`;
  });
}

/* ================= лоадер ================= */
const LINES = ['— Запись идёт?','Идёт.','— Начнём сразу?','Давайте без разминки.','— Тогда начали.'];
const checks = document.getElementById('checks');
if(reduced){
  checks.innerHTML = LINES.map(l=>`<span class="ln">${esc(l)}</span>`).join('');
}else{
  LINES.forEach((l,i)=>setTimeout(()=>{
    const s = document.createElement('span');
    s.className = 'ln'; s.textContent = l;
    checks.appendChild(s);
  }, 350 + i*430));
}

/* ================= загрузка ================= */
async function boot(){
  const minShow = reduced ? 0 : 2450; // драматургия лоадера не короче этого
  const [data] = await Promise.all([loadData(), sleep(minShow)]);
  cards = data.cards.map(cardHTML);
  buildChapters(data.cards.map(c=>c.label));
  render(1);
  document.getElementById('hint').innerHTML = coarse
    ? 'свайп · оглавление ниже'
    : '← → или 1–' + cards.length + ' · «/» — к форме · <a href="#" id="print">печать</a>';
  document.getElementById('print')?.addEventListener('click', e=>{ e.preventDefault(); print(); });
  document.getElementById('loader').classList.add('done');
  const wrap = document.getElementById('wrap');
  wrap.classList.add('ready');
  wrap.setAttribute('aria-busy','false');
  setTimeout(()=>document.getElementById('loader')?.remove(), 700);
}
boot();

/* ================= печать ================= */
let saved = null;
window.addEventListener('beforeprint', ()=>{ saved=cur; stage.innerHTML=cards.join(''); paint(); });
window.addEventListener('afterprint', ()=>{ if(saved!=null){ cur=saved; render(1); saved=null; } });
</script>
</body>
</html>
